services:
  mysql:
    image: mysql:8.0
    container_name: skribbl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-skribbl_root_secret}
      MYSQL_DATABASE: ${DB_NAME:-skribbl_db}
      MYSQL_USER: ${DB_USER:-skribbl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-skribbl_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-skribbl_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
